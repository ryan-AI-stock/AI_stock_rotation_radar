name: R1 Weekly Snapshot

on:
  schedule:
    - cron: "0 11-15 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: "Confirmed week-final Taiwan trading date, YYYY-MM-DD"
        required: false
        default: ""

concurrency:
  group: r1-weekly
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ryan-AI-stock/AI_stock_schedule_rules
          ref: main
          path: AI_stock_schedule_rules
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install '.[test]'
      - name: Resolve final trading date of week
        id: gate
        shell: bash
        run: |
          if [ -n "${{ inputs.report_date }}" ]; then
            d="${{ inputs.report_date }}"
            printf 'should_run=true\ntarget_date=%s\ntarget_key=%s\nreason=manual_confirmed_week_final\n' "$d" "${d//-/}" >> "$GITHUB_OUTPUT"
          else
            python -m r1.schedule --profile weekly --rules AI_stock_schedule_rules/schedule_rules.json
          fi
      - name: Validate R1
        if: steps.gate.outputs.should_run == 'true'
        run: python -m unittest discover -s tests -p 'test_r1*.py' -v
      - name: Restore source cache
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: data/current_base_cycle_source_cache
          key: r1-weekly-source-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            r1-source-${{ github.ref_name }}-
            c6-source-${{ github.ref_name }}-
      - name: Materialize week-final sources and append snapshot
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python -m r1.market_snapshot --date "${{ steps.gate.outputs.target_date }}" --output data/r1/daily_market_latest.json
          python -m r1.daily_sources --start "${{ steps.gate.outputs.target_date }}" --end "${{ steps.gate.outputs.target_date }}" --retry-incomplete
          python -m r1.consensus_snapshot --date "${{ steps.gate.outputs.target_date }}"
          python -m r1.valuation_snapshot --date "${{ steps.gate.outputs.target_date }}"
          python -m r1.weekly_snapshot --date "${{ steps.gate.outputs.target_date }}" --market data/r1/daily_market_latest.json --week-final-confirmed
          python -m r1.evidence_readiness --date "${{ steps.gate.outputs.target_date }}"
          python -m r1.dashboard_payload --market data/r1/daily_market_latest.json --output data/r1/dashboard_payload.json
      - name: Publish and read back R1 Dashboard
        if: steps.gate.outputs.should_run == 'true'
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          python -m r1.dashboard_publish \
            --spreadsheet-id 1j-Uh_hR3VgIqW-0ZdXuPPTrXN7arxAc_BxyA_h5U95M \
            --payload data/r1/dashboard_payload.json
      - name: Commit append-only weekly snapshot
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/r1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Append R1 weekly snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
