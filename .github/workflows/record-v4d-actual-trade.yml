name: Record actual V4-D trade

on:
  workflow_dispatch:
    inputs:
      action:
        description: "成交類型"
        required: true
        type: choice
        options: [legacy_sell, v4d_buy, v4d_sell]
      trade_date:
        description: "實際成交日 YYYY-MM-DD"
        required: true
      ticker:
        description: "股票代號"
        required: true
      average_price:
        description: "券商顯示的實際成交均價（已含／扣交易成本）"
        required: true
      shares:
        description: "成交股數"
        required: true

permissions:
  contents: write
  actions: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Record actual fill
        shell: bash
        env:
          TRADE_ACTION: ${{ inputs.action }}
          TRADE_DATE: ${{ inputs.trade_date }}
          TRADE_TICKER: ${{ inputs.ticker }}
          TRADE_AVERAGE_PRICE: ${{ inputs.average_price }}
          TRADE_SHARES: ${{ inputs.shares }}
        run: |
          set -euo pipefail
          python -m rotation_radar.v4d_actual_trade \
            --action "$TRADE_ACTION" \
            --trade-date "$TRADE_DATE" \
            --ticker "$TRADE_TICKER" \
            --average-price "$TRADE_AVERAGE_PRICE" \
            --shares "$TRADE_SHARES"
      - name: Commit durable actual trade state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/formal_v4d_actual_trade_state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record actual V4-D trade"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Regenerate report for trade date
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run generate-base-cycle-top10-report.yml --ref main -f report_date="${{ inputs.trade_date }}"
