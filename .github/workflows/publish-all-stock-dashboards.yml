name: Publish all stock Dashboards

on:
  workflow_dispatch:
    inputs:
      report_date:
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      report_date:
        required: false
        type: string
        default: ""

concurrency:
  group: all-stock-dashboards
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.final.outputs.should_run }}
      target_date: ${{ steps.final.outputs.target_date }}
    steps:
      - uses: actions/checkout@v4
      - name: Respect Ryan publication pause
        id: pause
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          state = json.load(open('config/dashboard_publication_state.json', encoding='utf-8'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"paused={'true' if state.get('paused') else 'false'}\n")
          PY
      - uses: actions/checkout@v4
        if: steps.pause.outputs.paused != 'true'
        with:
          repository: ryan-AI-stock/AI_stock_schedule_rules
          ref: main
          path: AI_stock_schedule_rules
      - name: Resolve one completed Taiwan session for every Dashboard
        if: steps.pause.outputs.paused != 'true'
        id: date
        env:
          SCHEDULE_RULES_PATH: ${{ github.workspace }}/AI_stock_schedule_rules/schedule_rules.json
        run: |
          for attempt in 1 2 3; do
            gate_output=$(mktemp)
            GITHUB_OUTPUT="$gate_output" python -m rotation_radar.schedule_gate --run-after 17:15 --recover-delayed-schedule
            if ! grep -q '^reason=calendar_unavailable$' "$gate_output"; then
              cat "$gate_output" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Official calendar unavailable, attempt $attempt/3"
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          echo "::error::Official calendar unavailable after three attempts; no publication allowed"
          exit 1
      - name: Reject unavailable calendar instead of successful no-op
        if: steps.pause.outputs.paused != 'true' && steps.date.outputs.reason == 'calendar_unavailable'
        run: exit 1
      - name: Validate requested date against completed session
        if: steps.pause.outputs.paused != 'true'
        id: request
        env:
          REQUESTED_DATE: ${{ inputs.report_date }}
          COMPLETED_DATE: ${{ steps.date.outputs.target_date }}
        run: |
          python - <<'PY'
          import os
          from datetime import date
          latest = os.environ['COMPLETED_DATE']
          requested = os.environ['REQUESTED_DATE'] or latest
          if requested and (not latest or date.fromisoformat(requested) > date.fromisoformat(latest)):
              raise SystemExit('Requested date is not completed; refusing future data')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'target_date={requested}\n')
          PY
      - name: Finalize publication decision
        id: final
        shell: bash
        env:
          PAUSED: ${{ steps.pause.outputs.paused }}
          GATE_SHOULD_RUN: ${{ steps.date.outputs.should_run }}
          TARGET_DATE: ${{ steps.request.outputs.target_date }}
        run: |
          if [ "$PAUSED" = true ]; then
            printf 'should_run=false\ntarget_date=\n' >> "$GITHUB_OUTPUT"
            echo "V4-D and both C6 Dashboards are paused by Ryan; no data or Sheet was updated." >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'should_run=%s\ntarget_date=%s\n' "$GATE_SHOULD_RUN" "$TARGET_DATE" >> "$GITHUB_OUTPUT"
          fi

  v4d:
    needs: target
    if: needs.target.outputs.should_run == 'true'
    uses: ./.github/workflows/v4d-dashboard-worker.yml
    with:
      report_date: ${{ needs.target.outputs.target_date }}
    secrets: inherit

  c6:
    needs: target
    if: needs.target.outputs.should_run == 'true'
    uses: ./.github/workflows/publish-c6-research-dashboard.yml
    with:
      report_date: ${{ needs.target.outputs.target_date }}
    secrets: inherit

  complete:
    if: always()
    needs: [target, v4d, c6]
    runs-on: ubuntu-latest
    steps:
      - name: All publications and readbacks must succeed
        env:
          TARGET_RESULT: ${{ needs.target.result }}
          SHOULD_RUN: ${{ needs.target.outputs.should_run }}
          V4D_RESULT: ${{ needs.v4d.result }}
          C6_RESULT: ${{ needs.c6.result }}
        run: |
          test "$TARGET_RESULT" = success
          if [ "$SHOULD_RUN" != true ]; then
            echo "No publication requested: paused or no eligible completed trading session." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$V4D_RESULT" = success
          test "$C6_RESULT" = success
          echo "V4-D and both C6 Dashboards finished publication and readback." >> "$GITHUB_STEP_SUMMARY"
