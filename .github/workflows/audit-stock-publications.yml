name: Audit six stock publications
on:
  workflow_dispatch:
concurrency:
  group: audit-stock-publications
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install '.[test]' pypdf
      - name: Read actual PDF dates and every Dashboard plus database
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: python -m rotation_radar.publication_audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-audit
          path: publication-audit.json
          if-no-files-found: error
          retention-days: 30
