name: V4-D institutional remainder research fill

on:
  workflow_dispatch:

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - run: python scripts/fetch_v4d_institutional_remainder.py
      - uses: actions/upload-artifact@v4
        with:
          name: v4d-institutional-remainder
          path: institutional_remainder/*.csv.gz
          if-no-files-found: error
